defaultLocaleCode: en
localeCodes:
  - en

awsAccountConfig:
  participantRole:
    iamPolicies:
      - static/cfn/iam_policy.json
  accountSources:
    - WorkshopStudio
  regionConfiguration:
    minAccessibleRegions: 1
    maxAccessibleRegions: 1
    accessibleRegions:
      recommended:
        - us-east-1
        - us-west-2
    deployableRegions:
      recommended:
        - us-east-1
        - us-west-2
infrastructure:
  cloudformationTemplates:
    - templateLocation: static/cfn/workshop-setup.yaml
      label: sagemaker-setup
      participantAllStackOutputsVisible: true
  requiredResources:
    sagemaker:
      - type: endpoint/ml.g5.12xlarge
        quantity: 1
params:
  author: Bruno Pistone, Nicolas Jourdan, Christian Kamwangala, Hossam Basudan
  description: Serverless Model Customization on SageMaker AI
  emailContact: bpistone@amazon.com, basudan@amazon.ae, kamwang@amazon.fr, njourdan@amazon.de
version: 2.0
