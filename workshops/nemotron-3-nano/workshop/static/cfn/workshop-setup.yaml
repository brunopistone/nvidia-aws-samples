---
AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Enhanced CloudFormation stack for Amazon SageMaker with dynamic multi-region support. Creates VPC with dynamic subnet allocation across multiple AZs, VPC endpoints, and SageMaker Studio Domain.

Mappings:
  # Distribution image accounts, not the Studio Classic kernel image accounts:
  # https://docs.aws.amazon.com/sagemaker/latest/dg/notebooks-available-images.html
  RegionMap:
    us-east-1:
      AZCount: 6
      DistributionImageAccount: "885854791233"
    us-east-2:
      AZCount: 3
      DistributionImageAccount: "137914896644"
    us-west-1:
      AZCount: 2
      DistributionImageAccount: "053634841547"
    us-west-2:
      AZCount: 3
      DistributionImageAccount: "542918446943"
    af-south-1:
      AZCount: 3
      DistributionImageAccount: "238384257742"
    ap-east-1:
      AZCount: 3
      DistributionImageAccount: "523751269255"
    ap-south-1:
      AZCount: 3
      DistributionImageAccount: "245090515133"
    ap-northeast-2:
      AZCount: 4
      DistributionImageAccount: "064688005998"
    ap-southeast-1:
      AZCount: 3
      DistributionImageAccount: "022667117163"
    ap-southeast-2:
      AZCount: 3
      DistributionImageAccount: "648430277019"
    ap-northeast-1:
      AZCount: 3
      DistributionImageAccount: "010972774902"
    ca-central-1:
      AZCount: 3
      DistributionImageAccount: "481561238223"
    eu-central-1:
      AZCount: 3
      DistributionImageAccount: "545423591354"
    eu-west-1:
      AZCount: 3
      DistributionImageAccount: "819792524951"
    eu-west-2:
      AZCount: 3
      DistributionImageAccount: "021081402939"
    eu-west-3:
      AZCount: 3
      DistributionImageAccount: "856416204555"
    eu-north-1:
      AZCount: 3
      DistributionImageAccount: "175620155138"
    eu-south-1:
      AZCount: 3
      DistributionImageAccount: "810671768855"
    sa-east-1:
      AZCount: 3
      DistributionImageAccount: "567556641782"
    ap-northeast-3:
      AZCount: 3
      DistributionImageAccount: "564864627153"
    ap-southeast-3:
      AZCount: 3
      DistributionImageAccount: "370607712162"
    me-south-1:
      AZCount: 3
      DistributionImageAccount: "523774347010"
    me-central-1:
      AZCount: 3
      DistributionImageAccount: "358593528301"

Parameters:
  VpcCidr:
    Type: String
    Default: "10.0.0.0/16"
    Description: CIDR block for the VPC

  SageMakerStudioDomainName:
    Type: String
    Description: Name of the Studio Domain to Create
    Default: Generative-AI-Domain

  SageMakerStudioDefaultUserName:
    Type: String
    Description: Name of gen ai user to create in SageMaker Domain
    Default: genai-user

  JupyterLabInstanceType:
    Type: String
    Description: Instance type for JupyterLab space
    Default: ml.m5.large

  WorkshopLifecycleRevision:
    Type: String
    Default: v2
    AllowedPattern: "[A-Za-z0-9-]+"
    MaxLength: 16
    Description: Change this revision when updating the lifecycle script or repository ref; SageMaker lifecycle configs are immutable.

  WorkshopRepositoryRef:
    Type: String
    Default: main
    AllowedPattern: "[A-Za-z0-9][A-Za-z0-9._/-]*"
    MaxLength: 128
    Description: Branch or tag in the canonical aws-samples repository for first checkout only; existing work is never updated.

  JupyterLabStorageSize:
    Type: Number
    Description: EBS storage size in GB for JupyterLab space
    Default: 20
    MinValue: 5
    MaxValue: 100

Conditions:
  HasThreeOrMoreAZs: !Or
    - !Equals [!FindInMap [RegionMap, !Ref "AWS::Region", AZCount], 3]
    - !Equals [!FindInMap [RegionMap, !Ref "AWS::Region", AZCount], 4]
    - !Equals [!FindInMap [RegionMap, !Ref "AWS::Region", AZCount], 5]
    - !Equals [!FindInMap [RegionMap, !Ref "AWS::Region", AZCount], 6]
  HasFourOrMoreAZs: !Or
    - !Equals [!FindInMap [RegionMap, !Ref "AWS::Region", AZCount], 4]
    - !Equals [!FindInMap [RegionMap, !Ref "AWS::Region", AZCount], 5]
    - !Equals [!FindInMap [RegionMap, !Ref "AWS::Region", AZCount], 6]
  HasFiveOrMoreAZs: !Or
    - !Equals [!FindInMap [RegionMap, !Ref "AWS::Region", AZCount], 5]
    - !Equals [!FindInMap [RegionMap, !Ref "AWS::Region", AZCount], 6]
  HasSixOrMoreAZs:
    !Equals [!FindInMap [RegionMap, !Ref "AWS::Region", AZCount], 6]

Resources:
  StudioBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "sagemaker-${AWS::Region}-${AWS::AccountId}"
      CorsConfiguration:
        CorsRules:
          - AllowedHeaders: ["*"]
            AllowedMethods:
              - POST
              - PUT
              - GET
              - HEAD
              - DELETE
            AllowedOrigins: ["https://*.sagemaker.aws"]
            ExposedHeaders:
              - ETag
              - x-amz-delete-marker
              - x-amz-id-2
              - x-amz-request-id
              - x-amz-server-side-encryption
              - x-amz-version-id

  VPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: !Ref VpcCidr
      EnableDnsHostnames: true
      EnableDnsSupport: true
      Tags:
        - Key: "for-use-with-amazon-emr-managed-policies"
          Value: "true"
        - Key: Name
          Value: !Sub "${AWS::StackName}-VPC"

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-IGW"

  InternetGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      InternetGatewayId: !Ref InternetGateway
      VpcId: !Ref VPC

  # Public Subnets
  PublicSubnetAZ1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      AvailabilityZone: !Select [0, !GetAZs ""]
      CidrBlock: !Select [0, !Cidr [!Ref VpcCidr, 12, 8]]
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-public-subnet-az1"

  PublicSubnetAZ2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      AvailabilityZone: !Select [1, !GetAZs ""]
      CidrBlock: !Select [1, !Cidr [!Ref VpcCidr, 12, 8]]
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-public-subnet-az2"

  PublicSubnetAZ3:
    Type: AWS::EC2::Subnet
    Condition: HasThreeOrMoreAZs
    Properties:
      VpcId: !Ref VPC
      AvailabilityZone: !Select [2, !GetAZs ""]
      CidrBlock: !Select [2, !Cidr [!Ref VpcCidr, 12, 8]]
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-public-subnet-az3"

  PublicSubnetAZ4:
    Type: AWS::EC2::Subnet
    Condition: HasFourOrMoreAZs
    Properties:
      VpcId: !Ref VPC
      AvailabilityZone: !Select [3, !GetAZs ""]
      CidrBlock: !Select [3, !Cidr [!Ref VpcCidr, 12, 8]]
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-public-subnet-az4"

  PublicSubnetAZ5:
    Type: AWS::EC2::Subnet
    Condition: HasFiveOrMoreAZs
    Properties:
      VpcId: !Ref VPC
      AvailabilityZone: !Select [4, !GetAZs ""]
      CidrBlock: !Select [4, !Cidr [!Ref VpcCidr, 12, 8]]
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-public-subnet-az5"

  PublicSubnetAZ6:
    Type: AWS::EC2::Subnet
    Condition: HasSixOrMoreAZs
    Properties:
      VpcId: !Ref VPC
      AvailabilityZone: !Select [5, !GetAZs ""]
      CidrBlock: !Select [5, !Cidr [!Ref VpcCidr, 12, 8]]
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-public-subnet-az6"

  # Private Subnets
  PrivateSubnetAZ1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      AvailabilityZone: !Select [0, !GetAZs ""]
      CidrBlock: !Select [6, !Cidr [!Ref VpcCidr, 12, 8]]
      Tags:
        - Key: "for-use-with-amazon-emr-managed-policies"
          Value: "true"
        - Key: Name
          Value: !Sub "${AWS::StackName}-private-subnet-az1"

  PrivateSubnetAZ2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      AvailabilityZone: !Select [1, !GetAZs ""]
      CidrBlock: !Select [7, !Cidr [!Ref VpcCidr, 12, 8]]
      Tags:
        - Key: "for-use-with-amazon-emr-managed-policies"
          Value: "true"
        - Key: Name
          Value: !Sub "${AWS::StackName}-private-subnet-az2"

  PrivateSubnetAZ3:
    Type: AWS::EC2::Subnet
    Condition: HasThreeOrMoreAZs
    Properties:
      VpcId: !Ref VPC
      AvailabilityZone: !Select [2, !GetAZs ""]
      CidrBlock: !Select [8, !Cidr [!Ref VpcCidr, 12, 8]]
      Tags:
        - Key: "for-use-with-amazon-emr-managed-policies"
          Value: "true"
        - Key: Name
          Value: !Sub "${AWS::StackName}-private-subnet-az3"

  PrivateSubnetAZ4:
    Type: AWS::EC2::Subnet
    Condition: HasFourOrMoreAZs
    Properties:
      VpcId: !Ref VPC
      AvailabilityZone: !Select [3, !GetAZs ""]
      CidrBlock: !Select [9, !Cidr [!Ref VpcCidr, 12, 8]]
      Tags:
        - Key: "for-use-with-amazon-emr-managed-policies"
          Value: "true"
        - Key: Name
          Value: !Sub "${AWS::StackName}-private-subnet-az4"

  PrivateSubnetAZ5:
    Type: AWS::EC2::Subnet
    Condition: HasFiveOrMoreAZs
    Properties:
      VpcId: !Ref VPC
      AvailabilityZone: !Select [4, !GetAZs ""]
      CidrBlock: !Select [10, !Cidr [!Ref VpcCidr, 12, 8]]
      Tags:
        - Key: "for-use-with-amazon-emr-managed-policies"
          Value: "true"
        - Key: Name
          Value: !Sub "${AWS::StackName}-private-subnet-az5"

  PrivateSubnetAZ6:
    Type: AWS::EC2::Subnet
    Condition: HasSixOrMoreAZs
    Properties:
      VpcId: !Ref VPC
      AvailabilityZone: !Select [5, !GetAZs ""]
      CidrBlock: !Select [11, !Cidr [!Ref VpcCidr, 12, 8]]
      Tags:
        - Key: "for-use-with-amazon-emr-managed-policies"
          Value: "true"
        - Key: Name
          Value: !Sub "${AWS::StackName}-private-subnet-az6"

  # NAT Gateway
  NatGatewayEIP:
    Type: AWS::EC2::EIP
    DependsOn: InternetGatewayAttachment
    Properties:
      Domain: vpc
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-nat-eip"

  NatGateway:
    Type: AWS::EC2::NatGateway
    Properties:
      AllocationId: !GetAtt NatGatewayEIP.AllocationId
      SubnetId: !Ref PublicSubnetAZ1
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-nat-gateway"

  # Public Route Table
  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-public-rt"

  PublicRoute:
    Type: AWS::EC2::Route
    DependsOn: InternetGatewayAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: "0.0.0.0/0"
      GatewayId: !Ref InternetGateway

  PublicSubnetAZ1RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId: !Ref PublicRouteTable
      SubnetId: !Ref PublicSubnetAZ1

  PublicSubnetAZ2RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId: !Ref PublicRouteTable
      SubnetId: !Ref PublicSubnetAZ2

  PublicSubnetAZ3RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Condition: HasThreeOrMoreAZs
    Properties:
      RouteTableId: !Ref PublicRouteTable
      SubnetId: !Ref PublicSubnetAZ3

  PublicSubnetAZ4RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Condition: HasFourOrMoreAZs
    Properties:
      RouteTableId: !Ref PublicRouteTable
      SubnetId: !Ref PublicSubnetAZ4

  PublicSubnetAZ5RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Condition: HasFiveOrMoreAZs
    Properties:
      RouteTableId: !Ref PublicRouteTable
      SubnetId: !Ref PublicSubnetAZ5

  PublicSubnetAZ6RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Condition: HasSixOrMoreAZs
    Properties:
      RouteTableId: !Ref PublicRouteTable
      SubnetId: !Ref PublicSubnetAZ6

  # Private Route Table
  PrivateRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-private-rt"

  PrivateRoute:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId: !Ref PrivateRouteTable
      DestinationCidrBlock: "0.0.0.0/0"
      NatGatewayId: !Ref NatGateway

  PrivateSubnetAZ1RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId: !Ref PrivateRouteTable
      SubnetId: !Ref PrivateSubnetAZ1

  PrivateSubnetAZ2RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId: !Ref PrivateRouteTable
      SubnetId: !Ref PrivateSubnetAZ2

  PrivateSubnetAZ3RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Condition: HasThreeOrMoreAZs
    Properties:
      RouteTableId: !Ref PrivateRouteTable
      SubnetId: !Ref PrivateSubnetAZ3

  PrivateSubnetAZ4RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Condition: HasFourOrMoreAZs
    Properties:
      RouteTableId: !Ref PrivateRouteTable
      SubnetId: !Ref PrivateSubnetAZ4

  PrivateSubnetAZ5RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Condition: HasFiveOrMoreAZs
    Properties:
      RouteTableId: !Ref PrivateRouteTable
      SubnetId: !Ref PrivateSubnetAZ5

  PrivateSubnetAZ6RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Condition: HasSixOrMoreAZs
    Properties:
      RouteTableId: !Ref PrivateRouteTable
      SubnetId: !Ref PrivateSubnetAZ6

  # Security Groups
  SageMakerInstanceSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      Tags:
        - Key: "for-use-with-amazon-emr-managed-policies"
          Value: "true"
        - Key: Name
          Value: !Sub "${AWS::StackName}-sm-instance-sg"
      GroupName: SMSG
      GroupDescription: Security group for SageMaker instances
      SecurityGroupEgress:
        - IpProtocol: -1
          FromPort: -1
          ToPort: -1
          CidrIp: 0.0.0.0/0
      VpcId: !Ref VPC

  SageMakerInstanceSecurityGroupIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      IpProtocol: "-1"
      GroupId: !Ref SageMakerInstanceSecurityGroup
      SourceSecurityGroupId: !Ref SageMakerInstanceSecurityGroup

  VPCEndpointSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allow TLS for VPC Endpoint
      SecurityGroupEgress:
        - IpProtocol: -1
          FromPort: -1
          ToPort: -1
          CidrIp: 0.0.0.0/0
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-vpce-sg"

  EndpointSecurityGroupIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      IpProtocol: "-1"
      GroupId: !Ref VPCEndpointSecurityGroup
      SourceSecurityGroupId: !Ref SageMakerInstanceSecurityGroup

  # VPC Endpoints
  S3Endpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      ServiceName: !Sub "com.amazonaws.${AWS::Region}.s3"
      VpcEndpointType: Gateway
      PolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal: "*"
            Action: "*"
            Resource: "*"
      VpcId: !Ref VPC
      RouteTableIds:
        - !Ref PrivateRouteTable

  VPCEndpointSagemakerAPI:
    Type: AWS::EC2::VPCEndpoint
    DependsOn: S3Endpoint
    Properties:
      PolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal: "*"
            Action: "*"
            Resource: "*"
      VpcEndpointType: Interface
      PrivateDnsEnabled: true
      SubnetIds:
        - !Ref PrivateSubnetAZ1
        - !Ref PrivateSubnetAZ2
        - !If [HasThreeOrMoreAZs, !Ref PrivateSubnetAZ3, !Ref AWS::NoValue]
        - !If [HasFourOrMoreAZs, !Ref PrivateSubnetAZ4, !Ref AWS::NoValue]
        - !If [HasFiveOrMoreAZs, !Ref PrivateSubnetAZ5, !Ref AWS::NoValue]
        - !If [HasSixOrMoreAZs, !Ref PrivateSubnetAZ6, !Ref AWS::NoValue]
      SecurityGroupIds:
        - !Ref VPCEndpointSecurityGroup
      ServiceName: !Sub "com.amazonaws.${AWS::Region}.sagemaker.api"
      VpcId: !Ref VPC

  VPCEndpointSageMakerRuntime:
    Type: AWS::EC2::VPCEndpoint
    DependsOn: VPCEndpointSagemakerAPI
    Properties:
      PolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal: "*"
            Action: "*"
            Resource: "*"
      VpcEndpointType: Interface
      PrivateDnsEnabled: true
      SubnetIds:
        - !Ref PrivateSubnetAZ1
        - !Ref PrivateSubnetAZ2
        - !If [HasThreeOrMoreAZs, !Ref PrivateSubnetAZ3, !Ref AWS::NoValue]
        - !If [HasFourOrMoreAZs, !Ref PrivateSubnetAZ4, !Ref AWS::NoValue]
        - !If [HasFiveOrMoreAZs, !Ref PrivateSubnetAZ5, !Ref AWS::NoValue]
        - !If [HasSixOrMoreAZs, !Ref PrivateSubnetAZ6, !Ref AWS::NoValue]
      SecurityGroupIds:
        - !Ref VPCEndpointSecurityGroup
      ServiceName: !Sub "com.amazonaws.${AWS::Region}.sagemaker.runtime"
      VpcId: !Ref VPC

  VPCEndpointSTS:
    Type: AWS::EC2::VPCEndpoint
    DependsOn: VPCEndpointSageMakerRuntime
    Properties:
      PolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal: "*"
            Action: "*"
            Resource: "*"
      VpcEndpointType: Interface
      PrivateDnsEnabled: true
      SubnetIds:
        - !Ref PrivateSubnetAZ1
        - !Ref PrivateSubnetAZ2
        - !If [HasThreeOrMoreAZs, !Ref PrivateSubnetAZ3, !Ref AWS::NoValue]
        - !If [HasFourOrMoreAZs, !Ref PrivateSubnetAZ4, !Ref AWS::NoValue]
        - !If [HasFiveOrMoreAZs, !Ref PrivateSubnetAZ5, !Ref AWS::NoValue]
        - !If [HasSixOrMoreAZs, !Ref PrivateSubnetAZ6, !Ref AWS::NoValue]
      SecurityGroupIds:
        - !Ref VPCEndpointSecurityGroup
      ServiceName: !Sub "com.amazonaws.${AWS::Region}.sts"
      VpcId: !Ref VPC

  VPCEndpointCW:
    Type: AWS::EC2::VPCEndpoint
    DependsOn: VPCEndpointSTS
    Properties:
      PolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal: "*"
            Action: "*"
            Resource: "*"
      VpcEndpointType: Interface
      PrivateDnsEnabled: true
      SubnetIds:
        - !Ref PrivateSubnetAZ1
        - !Ref PrivateSubnetAZ2
        - !If [HasThreeOrMoreAZs, !Ref PrivateSubnetAZ3, !Ref AWS::NoValue]
        - !If [HasFourOrMoreAZs, !Ref PrivateSubnetAZ4, !Ref AWS::NoValue]
        - !If [HasFiveOrMoreAZs, !Ref PrivateSubnetAZ5, !Ref AWS::NoValue]
        - !If [HasSixOrMoreAZs, !Ref PrivateSubnetAZ6, !Ref AWS::NoValue]
      SecurityGroupIds:
        - !Ref VPCEndpointSecurityGroup
      ServiceName: !Sub "com.amazonaws.${AWS::Region}.monitoring"
      VpcId: !Ref VPC

  VPCEndpointCWL:
    Type: AWS::EC2::VPCEndpoint
    DependsOn: VPCEndpointCW
    Properties:
      PolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal: "*"
            Action: "*"
            Resource: "*"
      VpcEndpointType: Interface
      PrivateDnsEnabled: true
      SubnetIds:
        - !Ref PrivateSubnetAZ1
        - !Ref PrivateSubnetAZ2
        - !If [HasThreeOrMoreAZs, !Ref PrivateSubnetAZ3, !Ref AWS::NoValue]
        - !If [HasFourOrMoreAZs, !Ref PrivateSubnetAZ4, !Ref AWS::NoValue]
        - !If [HasFiveOrMoreAZs, !Ref PrivateSubnetAZ5, !Ref AWS::NoValue]
        - !If [HasSixOrMoreAZs, !Ref PrivateSubnetAZ6, !Ref AWS::NoValue]
      SecurityGroupIds:
        - !Ref VPCEndpointSecurityGroup
      ServiceName: !Sub "com.amazonaws.${AWS::Region}.logs"
      VpcId: !Ref VPC

  VPCEndpointECR:
    Type: AWS::EC2::VPCEndpoint
    DependsOn: VPCEndpointCWL
    Properties:
      PolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal: "*"
            Action: "*"
            Resource: "*"
      VpcEndpointType: Interface
      PrivateDnsEnabled: true
      SubnetIds:
        - !Ref PrivateSubnetAZ1
        - !Ref PrivateSubnetAZ2
        - !If [HasThreeOrMoreAZs, !Ref PrivateSubnetAZ3, !Ref AWS::NoValue]
        - !If [HasFourOrMoreAZs, !Ref PrivateSubnetAZ4, !Ref AWS::NoValue]
        - !If [HasFiveOrMoreAZs, !Ref PrivateSubnetAZ5, !Ref AWS::NoValue]
        - !If [HasSixOrMoreAZs, !Ref PrivateSubnetAZ6, !Ref AWS::NoValue]
      SecurityGroupIds:
        - !Ref VPCEndpointSecurityGroup
      ServiceName: !Sub "com.amazonaws.${AWS::Region}.ecr.dkr"
      VpcId: !Ref VPC

  VPCEndpointECRAPI:
    Type: AWS::EC2::VPCEndpoint
    DependsOn: VPCEndpointECR
    Properties:
      PolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal: "*"
            Action: "*"
            Resource: "*"
      VpcEndpointType: Interface
      PrivateDnsEnabled: true
      SubnetIds:
        - !Ref PrivateSubnetAZ1
        - !Ref PrivateSubnetAZ2
        - !If [HasThreeOrMoreAZs, !Ref PrivateSubnetAZ3, !Ref AWS::NoValue]
        - !If [HasFourOrMoreAZs, !Ref PrivateSubnetAZ4, !Ref AWS::NoValue]
        - !If [HasFiveOrMoreAZs, !Ref PrivateSubnetAZ5, !Ref AWS::NoValue]
        - !If [HasSixOrMoreAZs, !Ref PrivateSubnetAZ6, !Ref AWS::NoValue]
      SecurityGroupIds:
        - !Ref VPCEndpointSecurityGroup
      ServiceName: !Sub "com.amazonaws.${AWS::Region}.ecr.api"
      VpcId: !Ref VPC

  VPCEndpointKMS:
    Type: AWS::EC2::VPCEndpoint
    DependsOn: VPCEndpointECRAPI
    Properties:
      PolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal: "*"
            Action: "*"
            Resource: "*"
      VpcEndpointType: Interface
      PrivateDnsEnabled: true
      SubnetIds:
        - !Ref PrivateSubnetAZ1
        - !Ref PrivateSubnetAZ2
        - !If [HasThreeOrMoreAZs, !Ref PrivateSubnetAZ3, !Ref AWS::NoValue]
        - !If [HasFourOrMoreAZs, !Ref PrivateSubnetAZ4, !Ref AWS::NoValue]
        - !If [HasFiveOrMoreAZs, !Ref PrivateSubnetAZ5, !Ref AWS::NoValue]
        - !If [HasSixOrMoreAZs, !Ref PrivateSubnetAZ6, !Ref AWS::NoValue]
      SecurityGroupIds:
        - !Ref VPCEndpointSecurityGroup
      ServiceName: !Sub "com.amazonaws.${AWS::Region}.kms"
      VpcId: !Ref VPC

  # KMS Key for SageMaker Domain EFS encryption
  SageMakerKMSKey:
    Type: AWS::KMS::Key
    Properties:
      Description: KMS key for SageMaker Domain EFS encryption
      KeyPolicy:
        Version: "2012-10-17"
        Statement:
          - Sid: Enable IAM User Permissions
            Effect: Allow
            Principal:
              AWS: !Sub "arn:aws:iam::${AWS::AccountId}:root"
            Action: "kms:*"
            Resource: "*"
          - Sid: Allow SageMaker to use the key
            Effect: Allow
            Principal:
              Service: sagemaker.amazonaws.com
            Action:
              - "kms:Decrypt"
              - "kms:DescribeKey"
              - "kms:CreateGrant"
            Resource: "*"

  SageMakerKMSKeyAlias:
    Type: AWS::KMS::Alias
    Properties:
      AliasName: !Sub "alias/${AWS::StackName}-sagemaker"
      TargetKeyId: !Ref SageMakerKMSKey

  # Run as the notebook user so new files belong to the participant, not root.
  JupyterLabLifecycleConfig:
    Type: AWS::SageMaker::StudioLifecycleConfig
    Properties:
      StudioLifecycleConfigAppType: JupyterLab
      # A stack UUID avoids name-length/collision issues; revision permits replacement.
      StudioLifecycleConfigName: !Sub
        - "workshop-${StackUuid}-${WorkshopLifecycleRevision}"
        - StackUuid: !Select [2, !Split ["/", !Ref "AWS::StackId"]]
      StudioLifecycleConfigContent: !Base64
        Fn::Sub: |
          #!/bin/bash
          set -euo pipefail
          sudo -u sagemaker-user -H bash <<'WORKSHOP'
          set -euo pipefail
          TARGET=/home/sagemaker-user/generative-ai-on-amazon-sagemaker
          SUBTREE=workshops/fine-tune-nvidia-nemotron-3-sagemaker-ai
          REF='${WorkshopRepositoryRef}'
          # A lock also protects against concurrent manual/bootstrap invocations.
          exec 9>/home/sagemaker-user/.workshop-checkout.lock
          flock -w 10 9
          if [ -e "$TARGET" ] || [ -L "$TARGET" ]; then
            echo "Preserving existing $TARGET; no pull, reset or dependency installation."
          else
            # Stage on persistent storage. A failed checkout never occupies TARGET.
            STAGING=$(mktemp -d /home/sagemaker-user/.workshop-checkout.XXXXXX)
            if timeout --kill-after=10s 240s env GIT_TERMINAL_PROMPT=0 bash -s -- "$REF" "$STAGING/repository" "$SUBTREE" <<'SPARSE'
          set -euo pipefail
          REF=$1
          REPOSITORY=$2
          SUBTREE=$3
          git clone --depth 1 --filter=blob:none --no-checkout --branch "$REF" \
            https://github.com/aws-samples/generative-ai-on-amazon-sagemaker.git "$REPOSITORY"
          if [ "$(git -C "$REPOSITORY" cat-file -t "HEAD:$SUBTREE")" != tree ]; then
            echo "ERROR: $SUBTREE is not a directory at branch/tag $REF. Confirm publication with your instructor."
            exit 1
          fi
          # Non-cone mode excludes root and sibling files; retain .git for provenance.
          git -C "$REPOSITORY" sparse-checkout set --no-cone "/$SUBTREE/"
          # HEAD is the commit selected by clone, including when REF names a tag.
          git -C "$REPOSITORY" checkout --detach HEAD
          if [ ! -d "$REPOSITORY/$SUBTREE/01-serverless-workshop" ] || [ ! -d "$REPOSITORY/$SUBTREE/02-smtj-workshop" ]; then
            echo "ERROR: Expected workshop tracks missing at branch/tag $REF; checkout not installed."
            exit 1
          fi
          SPARSE
            then
              # -T/-n refuse to merge into or overwrite a destination created meanwhile.
              mv -T -n "$STAGING/repository" "$TARGET"
            else
              echo "WARNING: Sparse checkout failed or timed out. Staging retained at $STAGING; use the manual checkout instructions."
            fi
          fi
          ROOT="$TARGET/$SUBTREE"
          if [ -d "$ROOT/01-serverless-workshop" ] && [ -d "$ROOT/02-smtj-workshop" ]; then
            echo "Workshop source available at $ROOT"
          else
            echo "WARNING: Expected workshop tracks missing. Confirm the published branch/tag with your instructor."
          fi
          WORKSHOP

  # IAM Role
  SageMakerExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${AWS::StackName}-executionrole"
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - bedrock.amazonaws.com
                - sagemaker.amazonaws.com
                - lambda.amazonaws.com
                - s3.amazonaws.com
            Action:
              - "sts:AssumeRole"
      Path: /
      Policies:
        - PolicyName: !Sub "${AWS::StackName}-sageemr"
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Sid: ReadSecretFromSecretsManager
                Effect: Allow
                Action:
                  - "secretsmanager:GetSecretValue"
                Resource: !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:*"
              - Effect: Allow
                Action:
                  - elasticmapreduce:ListInstances
                  - elasticmapreduce:DescribeCluster
                  - elasticmapreduce:DescribeSecurityConfiguration
                  - elasticmapreduce:CreatePersistentAppUI
                  - elasticmapreduce:DescribePersistentAppUI
                  - elasticmapreduce:GetPersistentAppUIPresignedURL
                  - elasticmapreduce:GetOnClusterAppUIPresignedURL
                  - elasticmapreduce:ListClusters
                  - iam:GetRole
                  - iam:PassRole
                  - logs:*
                  - kms:*
                Resource: "*"
              - Effect: Allow
                Action:
                  - elasticmapreduce:DescribeCluster
                  - elasticmapreduce:ListInstanceGroups
                Resource: !Sub "arn:${AWS::Partition}:elasticmapreduce:*:*:cluster/*"
              - Effect: Allow
                Action:
                  - elasticmapreduce:ListClusters
                Resource: "*"
        - PolicyName: !Sub "${AWS::StackName}-SMStar"
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Effect: "Allow"
                Action: "sagemaker:*"
                Resource: "*"
        - PolicyName: !Sub "${AWS::StackName}-BedrockStar"
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Effect: "Allow"
                Action: "bedrock:*"
                Resource: "*"
        # The first invocation of a third-party Bedrock model (for example Anthropic
        # Claude, used as the frontier baseline in lab 1) makes Bedrock open an AWS
        # Marketplace subscription on the caller's behalf. Without these actions that
        # subscription fails and the InvokeModel/Converse call returns AccessDenied.
        # The SDK pre-flights the execution role before submitting a job, using the
        # read-only iam:SimulatePrincipalPolicy API. Without it every job logs
        # "Could not verify permissions for role ... Proceeding with it."
        # sagemaker-mlflow is required for training runs to log to MLflow and is not
        # covered by AmazonSageMakerFullAccess.
        - PolicyName: !Sub "${AWS::StackName}-RoleSelfCheckAndMlflow"
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Effect: "Allow"
                Action:
                  - "iam:SimulatePrincipalPolicy"
                  - "sagemaker-mlflow:*"
                Resource: "*"
        - PolicyName: !Sub "${AWS::StackName}-MarketplaceSubscribe"
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Effect: "Allow"
                Action:
                  - "aws-marketplace:Subscribe"
                  - "aws-marketplace:Unsubscribe"
                  - "aws-marketplace:ViewSubscriptions"
                Resource: "*"
      ManagedPolicyArns:
        - !Sub "arn:${AWS::Partition}:iam::aws:policy/AmazonSageMakerFullAccess"
        - !Sub "arn:${AWS::Partition}:iam::aws:policy/AmazonS3FullAccess"
        - !Sub "arn:${AWS::Partition}:iam::aws:policy/AWSLambda_FullAccess"
        - !Sub "arn:${AWS::Partition}:iam::aws:policy/SecretsManagerReadWrite"
        - !Sub "arn:${AWS::Partition}:iam::aws:policy/AWSCloudTrail_FullAccess"
        - !Sub "arn:${AWS::Partition}:iam::aws:policy/CloudWatchFullAccessV2"

  # SageMaker Studio Domain
  StudioDomain:
    Type: AWS::SageMaker::Domain
    DependsOn:
      - SageMakerKMSKey
      - VPCEndpointKMS
      - VPCEndpointSagemakerAPI
      - VPCEndpointSageMakerRuntime
      - VPCEndpointSTS
      - S3Endpoint
      # VpcOnly startup clones from public GitHub through the existing NAT.
      - PublicRoute
      - PublicSubnetAZ1RouteTableAssociation
      - PrivateRoute
      - PrivateSubnetAZ1RouteTableAssociation
      - PrivateSubnetAZ2RouteTableAssociation
    Properties:
      DomainName: !Ref SageMakerStudioDomainName
      AppNetworkAccessType: VpcOnly
      AuthMode: IAM
      KmsKeyId: !GetAtt SageMakerKMSKey.Arn
      VpcId: !Ref VPC
      SubnetIds:
        - !Ref PrivateSubnetAZ1
        - !Ref PrivateSubnetAZ2
        - !If [HasThreeOrMoreAZs, !Ref PrivateSubnetAZ3, !Ref AWS::NoValue]
        - !If [HasFourOrMoreAZs, !Ref PrivateSubnetAZ4, !Ref AWS::NoValue]
        - !If [HasFiveOrMoreAZs, !Ref PrivateSubnetAZ5, !Ref AWS::NoValue]
        - !If [HasSixOrMoreAZs, !Ref PrivateSubnetAZ6, !Ref AWS::NoValue]
      DefaultUserSettings:
        ExecutionRole: !GetAtt SageMakerExecutionRole.Arn
        SecurityGroups:
          - !Ref SageMakerInstanceSecurityGroup
        JupyterLabAppSettings:
          LifecycleConfigArns:
            - !GetAtt JupyterLabLifecycleConfig.StudioLifecycleConfigArn
      DefaultSpaceSettings:
        ExecutionRole: !GetAtt SageMakerExecutionRole.Arn

  StudioUserProfile:
    Type: AWS::SageMaker::UserProfile
    Properties:
      DomainId: !Ref StudioDomain
      UserProfileName: !Ref SageMakerStudioDefaultUserName
      UserSettings:
        ExecutionRole: !GetAtt SageMakerExecutionRole.Arn
        SpaceStorageSettings:
          DefaultEbsStorageSettings:
            DefaultEbsVolumeSizeInGb: 5
            MaximumEbsVolumeSizeInGb: 100

  JupyterLabSpace:
    Type: AWS::SageMaker::Space
    DependsOn: StudioUserProfile
    Properties:
      DomainId: !Ref StudioDomain
      SpaceName: !Sub "${SageMakerStudioDefaultUserName}-jupyterlab-space"
      OwnershipSettings:
        OwnerUserProfileName: !Ref SageMakerStudioDefaultUserName
      SpaceSharingSettings:
        SharingType: Private
      SpaceSettings:
        AppType: JupyterLab
        JupyterLabAppSettings:
          DefaultResourceSpec:
            InstanceType: !Ref JupyterLabInstanceType
            LifecycleConfigArn: !GetAtt JupyterLabLifecycleConfig.StudioLifecycleConfigArn
            SageMakerImageArn: !Sub
              - "arn:${AWS::Partition}:sagemaker:${AWS::Region}:${ImageAccount}:image/sagemaker-distribution-cpu"
              - ImageAccount:
                  !FindInMap [
                    RegionMap,
                    !Ref "AWS::Region",
                    DistributionImageAccount,
                  ]
            # CFN Space ResourceSpec has no version alias field; CreateApp pins 4.5.0 below.
        SpaceStorageSettings:
          EbsStorageSettings:
            EbsVolumeSizeInGb: !Ref JupyterLabStorageSize

  # Lambda execution role for starting the JupyterLab space
  StartSpaceLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${AWS::StackName}-start-space-lambda-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: "sts:AssumeRole"
      ManagedPolicyArns:
        - !Sub "arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole"
      Policies:
        - PolicyName: SageMakerSpaceStartPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - "sagemaker:CreateApp"
                  - "sagemaker:DescribeApp"
                  - "sagemaker:DeleteApp"
                  - "sagemaker:AddTags"
                # Include old domain/space identities during CFN replacement cleanup.
                Resource: !Sub "arn:${AWS::Partition}:sagemaker:${AWS::Region}:${AWS::AccountId}:app/*/*-jupyterlab-space/JupyterLab/default"

  # Native CFN App does not support space-based JupyterLab or image version aliases.
  # Bound polling below the Lambda timeout and reserve time to respond to CFN.
  # Lambda function to start the JupyterLab space
  StartSpaceLambdaFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "${AWS::StackName}-start-jupyterlab-space"
      Runtime: python3.12
      Handler: index.handler
      Role: !GetAtt StartSpaceLambdaRole.Arn
      Timeout: 900
      Code:
        ZipFile: |
          import json
          import time
          import traceback
          import urllib.request
          import boto3
          from botocore.config import Config
          from botocore.exceptions import ClientError

          def respond(event, context, status, physical_id, data, reason):
              body = json.dumps({
                  'Status': status, 'Reason': reason[:1000],
                  'PhysicalResourceId': physical_id,
                  'StackId': event['StackId'], 'RequestId': event['RequestId'],
                  'LogicalResourceId': event['LogicalResourceId'], 'Data': data,
              }).encode('utf-8')
              request = urllib.request.Request(
                  event['ResponseURL'], data=body, method='PUT',
                  headers={'content-type': '', 'content-length': str(len(body))})
              # Never log the presigned response URL. Each attempt is bounded.
              for attempt in range(3):
                  try:
                      with urllib.request.urlopen(request, timeout=10) as response:
                          response.read()
                      return
                  except Exception:
                      if attempt == 2:
                          raise
                      time.sleep(1)

          def describe(client, identity):
              try:
                  return client.describe_app(**identity)
              except ClientError as error:
                  if error.response['Error']['Code'] == 'ResourceNotFound':
                      return {'Status': 'Deleted'}
                  raise

          def reconcile(client, identity, spec, deleting, deadline):
              while time.monotonic() < deadline:
                  app = describe(client, identity)
                  state = app['Status']
                  if deleting:
                      if state == 'Deleted':
                          return {'Status': 'Deleted'}
                      if state != 'Deleting':
                          try:
                              client.delete_app(**identity)
                          except ClientError as error:
                              # Pending apps can briefly reject deletion; retry only in-use.
                              if error.response['Error']['Code'] not in ('ResourceInUse', 'ResourceNotFound'):
                                  raise
                  else:
                      if state == 'Deleted':
                          try:
                              client.create_app(**identity, ResourceSpec=spec)
                          except ClientError as error:
                              if error.response['Error']['Code'] != 'ResourceInUse':
                                  raise
                      elif state == 'Failed':
                          raise RuntimeError('JupyterLab failed: ' + app.get('FailureReason', 'unknown reason'))
                      elif state == 'InService':
                          # Never interrupt a participant's running app on stack updates.
                          actual = app.get('ResourceSpec', {})
                          # DescribeApp may return a resolved version ARN instead of the alias.
                          mismatches = [key for key, value in spec.items()
                                        if (key != 'SageMakerImageVersionAlias' or key in actual)
                                        and actual.get(key) != value]
                          if mismatches:
                              raise RuntimeError('Save work and stop the existing app before updating: ' + ', '.join(mismatches))
                          return {'Status': state, 'AppArn': app['AppArn']}
                  time.sleep(10)
              raise TimeoutError('Timed out waiting for JupyterLab ' +
                                 ('deletion; stop the app and retry stack deletion.' if deleting else
                                  'InService; inspect Studio status and lifecycle logs.'))

          def handler(event, context):
              physical_id = event.get('PhysicalResourceId', event['LogicalResourceId'])
              status, data, reason = 'FAILED', {}, 'Unexpected startup failure'
              try:
                  props = event['ResourceProperties']
                  identity = {key: props[key] for key in ('DomainId', 'SpaceName')}
                  identity.update(AppType='JupyterLab', AppName='default')
                  request_type = event['RequestType']
                  old = event.get('OldResourceProperties', props)
                  if request_type != 'Delete' and (
                      'PhysicalResourceId' not in event or
                      any(old.get(key) != props[key] for key in ('DomainId', 'SpaceName'))
                  ):
                      physical_id = '/'.join(identity.values())
                  if request_type not in ('Create', 'Update', 'Delete'):
                      raise ValueError('Unsupported request type: ' + request_type)
                  deleting = request_type == 'Delete'
                  spec = {} if deleting else {key: props[key] for key in (
                      'InstanceType', 'LifecycleConfigArn', 'SageMakerImageArn',
                      'SageMakerImageVersionAlias')}
                  client = boto3.client('sagemaker', config=Config(
                      connect_timeout=5, read_timeout=10,
                      retries={'mode': 'standard', 'total_max_attempts': 2}))
                  deadline = time.monotonic() + min(780, context.get_remaining_time_in_millis() / 1000 - 90)
                  data = reconcile(client, identity, spec, deleting, deadline)
                  status, reason = 'SUCCESS', 'Observed JupyterLab status: ' + data['Status']
              except Exception as error:
                  traceback.print_exc()
                  reason = str(error)
              respond(event, context, status, physical_id, data, reason)

  # Custom resource to trigger the Lambda function
  StartJupyterLabSpace:
    Type: Custom::StartSpace
    DependsOn: JupyterLabSpace
    Properties:
      ServiceToken: !GetAtt StartSpaceLambdaFunction.Arn
      ServiceTimeout: 930
      # Conditional Refs add dependencies only for subnets present in this region.
      PrivateRouteAssociations:
        - !Ref PrivateSubnetAZ1RouteTableAssociation
        - !Ref PrivateSubnetAZ2RouteTableAssociation
        - !If [
            HasThreeOrMoreAZs,
            !Ref PrivateSubnetAZ3RouteTableAssociation,
            !Ref AWS::NoValue,
          ]
        - !If [
            HasFourOrMoreAZs,
            !Ref PrivateSubnetAZ4RouteTableAssociation,
            !Ref AWS::NoValue,
          ]
        - !If [
            HasFiveOrMoreAZs,
            !Ref PrivateSubnetAZ5RouteTableAssociation,
            !Ref AWS::NoValue,
          ]
        - !If [
            HasSixOrMoreAZs,
            !Ref PrivateSubnetAZ6RouteTableAssociation,
            !Ref AWS::NoValue,
          ]
      DomainId: !Ref StudioDomain
      SpaceName: !Sub "${SageMakerStudioDefaultUserName}-jupyterlab-space"
      InstanceType: !Ref JupyterLabInstanceType
      LifecycleConfigArn: !GetAtt JupyterLabLifecycleConfig.StudioLifecycleConfigArn
      SageMakerImageArn: !Sub
        - "arn:${AWS::Partition}:sagemaker:${AWS::Region}:${ImageAccount}:image/sagemaker-distribution-cpu"
        - ImageAccount:
            !FindInMap [RegionMap, !Ref "AWS::Region", DistributionImageAccount]
      SageMakerImageVersionAlias: "4.5.0"

Outputs:
  VpcId:
    Description: VPC ID
    Value: !Ref VPC
    Export:
      Name: !Sub "${AWS::StackName}-vpc-id"

  PrivateSubnets:
    Description: List of private subnet IDs
    Value: !Join
      - ","
      - - !Ref PrivateSubnetAZ1
        - !Ref PrivateSubnetAZ2
        - !If [HasThreeOrMoreAZs, !Ref PrivateSubnetAZ3, !Ref AWS::NoValue]
        - !If [HasFourOrMoreAZs, !Ref PrivateSubnetAZ4, !Ref AWS::NoValue]
        - !If [HasFiveOrMoreAZs, !Ref PrivateSubnetAZ5, !Ref AWS::NoValue]
        - !If [HasSixOrMoreAZs, !Ref PrivateSubnetAZ6, !Ref AWS::NoValue]
    Export:
      Name: !Sub "${AWS::StackName}-private-subnets"

  SageMakerCloudformationVPCId:
    Description: The ID of the Sagemaker Studio VPC
    Value: !Ref VPC
    Export:
      Name: "SageMakerCloudformationVPCId"

  SageMakerDomain:
    Description: "SageMaker Domain Id"
    Value: !Ref StudioDomain
    Export:
      Name: SageMakerDomainId

  SageMakerDomainUrl:
    Value: !Join
      - ""
      - - "https://console.aws.amazon.com/sagemaker/home?region="
        - !Ref "AWS::Region"
        - "#/studio/"
        - !Ref StudioDomain
    Description: URL to access the SageMaker Domain
