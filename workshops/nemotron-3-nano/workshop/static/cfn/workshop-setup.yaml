---
AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Enhanced CloudFormation stack for Amazon SageMaker with dynamic multi-region support. Creates VPC with dynamic subnet allocation across multiple AZs, VPC endpoints, and SageMaker Studio Domain.

Mappings:
  RegionMap:
    us-east-1:
      AZCount: 6
    us-east-2:
      AZCount: 3
    us-west-1:
      AZCount: 2
    us-west-2:
      AZCount: 3
    af-south-1:
      AZCount: 3
    ap-east-1:
      AZCount: 3
    ap-south-1:
      AZCount: 3
    ap-northeast-2:
      AZCount: 4
    ap-southeast-1:
      AZCount: 3
    ap-southeast-2:
      AZCount: 3
    ap-northeast-1:
      AZCount: 3
    ca-central-1:
      AZCount: 3
    eu-central-1:
      AZCount: 3
    eu-west-1:
      AZCount: 3
    eu-west-2:
      AZCount: 3
    eu-west-3:
      AZCount: 3
    eu-north-1:
      AZCount: 3
    eu-south-1:
      AZCount: 3
    sa-east-1:
      AZCount: 3
    ap-northeast-3:
      AZCount: 3
    ap-southeast-3:
      AZCount: 3
    me-south-1:
      AZCount: 3
    me-central-1:
      AZCount: 3

Parameters:
  VpcCidr:
    Type: String
    Default: "10.0.0.0/16"
    Description: CIDR block for the VPC

  SageMakerStudioDomainName:
    Type: String
    Description: Name of the Studio Domain to Create
    Default: Generative-AI-Domain

  SageMakerStudioDefaultUserName:
    Type: String
    Description: Name of gen ai user to create in SageMaker Domain
    Default: genai-user

  JupyterLabInstanceType:
    Type: String
    Description: Instance type for JupyterLab space
    Default: ml.m5.large

  JupyterLabStorageSize:
    Type: Number
    Description: EBS storage size in GB for JupyterLab space
    Default: 20
    MinValue: 5
    MaxValue: 100

Conditions:
  HasThreeOrMoreAZs: !Or
    - !Equals [!FindInMap [RegionMap, !Ref "AWS::Region", AZCount], 3]
    - !Equals [!FindInMap [RegionMap, !Ref "AWS::Region", AZCount], 4]
    - !Equals [!FindInMap [RegionMap, !Ref "AWS::Region", AZCount], 5]
    - !Equals [!FindInMap [RegionMap, !Ref "AWS::Region", AZCount], 6]
  HasFourOrMoreAZs: !Or
    - !Equals [!FindInMap [RegionMap, !Ref "AWS::Region", AZCount], 4]
    - !Equals [!FindInMap [RegionMap, !Ref "AWS::Region", AZCount], 5]
    - !Equals [!FindInMap [RegionMap, !Ref "AWS::Region", AZCount], 6]
  HasFiveOrMoreAZs: !Or
    - !Equals [!FindInMap [RegionMap, !Ref "AWS::Region", AZCount], 5]
    - !Equals [!FindInMap [RegionMap, !Ref "AWS::Region", AZCount], 6]
  HasSixOrMoreAZs:
    !Equals [!FindInMap [RegionMap, !Ref "AWS::Region", AZCount], 6]

Resources:
  StudioBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "sagemaker-${AWS::Region}-${AWS::AccountId}"
      CorsConfiguration:
        CorsRules:
          - AllowedHeaders: ["*"]
            AllowedMethods:
              - POST
              - PUT
              - GET
              - HEAD
              - DELETE
            AllowedOrigins: ["https://*.sagemaker.aws"]
            ExposedHeaders:
              - ETag
              - x-amz-delete-marker
              - x-amz-id-2
              - x-amz-request-id
              - x-amz-server-side-encryption
              - x-amz-version-id

  VPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: !Ref VpcCidr
      EnableDnsHostnames: true
      EnableDnsSupport: true
      Tags:
        - Key: "for-use-with-amazon-emr-managed-policies"
          Value: "true"
        - Key: Name
          Value: !Sub "${AWS::StackName}-VPC"

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-IGW"

  InternetGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      InternetGatewayId: !Ref InternetGateway
      VpcId: !Ref VPC

  # Public Subnets
  PublicSubnetAZ1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      AvailabilityZone: !Select [0, !GetAZs ""]
      CidrBlock: !Select [0, !Cidr [!Ref VpcCidr, 12, 8]]
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-public-subnet-az1"

  PublicSubnetAZ2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      AvailabilityZone: !Select [1, !GetAZs ""]
      CidrBlock: !Select [1, !Cidr [!Ref VpcCidr, 12, 8]]
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-public-subnet-az2"

  PublicSubnetAZ3:
    Type: AWS::EC2::Subnet
    Condition: HasThreeOrMoreAZs
    Properties:
      VpcId: !Ref VPC
      AvailabilityZone: !Select [2, !GetAZs ""]
      CidrBlock: !Select [2, !Cidr [!Ref VpcCidr, 12, 8]]
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-public-subnet-az3"

  PublicSubnetAZ4:
    Type: AWS::EC2::Subnet
    Condition: HasFourOrMoreAZs
    Properties:
      VpcId: !Ref VPC
      AvailabilityZone: !Select [3, !GetAZs ""]
      CidrBlock: !Select [3, !Cidr [!Ref VpcCidr, 12, 8]]
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-public-subnet-az4"

  PublicSubnetAZ5:
    Type: AWS::EC2::Subnet
    Condition: HasFiveOrMoreAZs
    Properties:
      VpcId: !Ref VPC
      AvailabilityZone: !Select [4, !GetAZs ""]
      CidrBlock: !Select [4, !Cidr [!Ref VpcCidr, 12, 8]]
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-public-subnet-az5"

  PublicSubnetAZ6:
    Type: AWS::EC2::Subnet
    Condition: HasSixOrMoreAZs
    Properties:
      VpcId: !Ref VPC
      AvailabilityZone: !Select [5, !GetAZs ""]
      CidrBlock: !Select [5, !Cidr [!Ref VpcCidr, 12, 8]]
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-public-subnet-az6"

  # Private Subnets
  PrivateSubnetAZ1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      AvailabilityZone: !Select [0, !GetAZs ""]
      CidrBlock: !Select [6, !Cidr [!Ref VpcCidr, 12, 8]]
      Tags:
        - Key: "for-use-with-amazon-emr-managed-policies"
          Value: "true"
        - Key: Name
          Value: !Sub "${AWS::StackName}-private-subnet-az1"

  PrivateSubnetAZ2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      AvailabilityZone: !Select [1, !GetAZs ""]
      CidrBlock: !Select [7, !Cidr [!Ref VpcCidr, 12, 8]]
      Tags:
        - Key: "for-use-with-amazon-emr-managed-policies"
          Value: "true"
        - Key: Name
          Value: !Sub "${AWS::StackName}-private-subnet-az2"

  PrivateSubnetAZ3:
    Type: AWS::EC2::Subnet
    Condition: HasThreeOrMoreAZs
    Properties:
      VpcId: !Ref VPC
      AvailabilityZone: !Select [2, !GetAZs ""]
      CidrBlock: !Select [8, !Cidr [!Ref VpcCidr, 12, 8]]
      Tags:
        - Key: "for-use-with-amazon-emr-managed-policies"
          Value: "true"
        - Key: Name
          Value: !Sub "${AWS::StackName}-private-subnet-az3"

  PrivateSubnetAZ4:
    Type: AWS::EC2::Subnet
    Condition: HasFourOrMoreAZs
    Properties:
      VpcId: !Ref VPC
      AvailabilityZone: !Select [3, !GetAZs ""]
      CidrBlock: !Select [9, !Cidr [!Ref VpcCidr, 12, 8]]
      Tags:
        - Key: "for-use-with-amazon-emr-managed-policies"
          Value: "true"
        - Key: Name
          Value: !Sub "${AWS::StackName}-private-subnet-az4"

  PrivateSubnetAZ5:
    Type: AWS::EC2::Subnet
    Condition: HasFiveOrMoreAZs
    Properties:
      VpcId: !Ref VPC
      AvailabilityZone: !Select [4, !GetAZs ""]
      CidrBlock: !Select [10, !Cidr [!Ref VpcCidr, 12, 8]]
      Tags:
        - Key: "for-use-with-amazon-emr-managed-policies"
          Value: "true"
        - Key: Name
          Value: !Sub "${AWS::StackName}-private-subnet-az5"

  PrivateSubnetAZ6:
    Type: AWS::EC2::Subnet
    Condition: HasSixOrMoreAZs
    Properties:
      VpcId: !Ref VPC
      AvailabilityZone: !Select [5, !GetAZs ""]
      CidrBlock: !Select [11, !Cidr [!Ref VpcCidr, 12, 8]]
      Tags:
        - Key: "for-use-with-amazon-emr-managed-policies"
          Value: "true"
        - Key: Name
          Value: !Sub "${AWS::StackName}-private-subnet-az6"

  # NAT Gateway
  NatGatewayEIP:
    Type: AWS::EC2::EIP
    DependsOn: InternetGatewayAttachment
    Properties:
      Domain: vpc
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-nat-eip"

  NatGateway:
    Type: AWS::EC2::NatGateway
    Properties:
      AllocationId: !GetAtt NatGatewayEIP.AllocationId
      SubnetId: !Ref PublicSubnetAZ1
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-nat-gateway"

  # Public Route Table
  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-public-rt"

  PublicRoute:
    Type: AWS::EC2::Route
    DependsOn: InternetGatewayAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: "0.0.0.0/0"
      GatewayId: !Ref InternetGateway

  PublicSubnetAZ1RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId: !Ref PublicRouteTable
      SubnetId: !Ref PublicSubnetAZ1

  PublicSubnetAZ2RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId: !Ref PublicRouteTable
      SubnetId: !Ref PublicSubnetAZ2

  PublicSubnetAZ3RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Condition: HasThreeOrMoreAZs
    Properties:
      RouteTableId: !Ref PublicRouteTable
      SubnetId: !Ref PublicSubnetAZ3

  PublicSubnetAZ4RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Condition: HasFourOrMoreAZs
    Properties:
      RouteTableId: !Ref PublicRouteTable
      SubnetId: !Ref PublicSubnetAZ4

  PublicSubnetAZ5RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Condition: HasFiveOrMoreAZs
    Properties:
      RouteTableId: !Ref PublicRouteTable
      SubnetId: !Ref PublicSubnetAZ5

  PublicSubnetAZ6RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Condition: HasSixOrMoreAZs
    Properties:
      RouteTableId: !Ref PublicRouteTable
      SubnetId: !Ref PublicSubnetAZ6

  # Private Route Table
  PrivateRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-private-rt"

  PrivateRoute:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId: !Ref PrivateRouteTable
      DestinationCidrBlock: "0.0.0.0/0"
      NatGatewayId: !Ref NatGateway

  PrivateSubnetAZ1RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId: !Ref PrivateRouteTable
      SubnetId: !Ref PrivateSubnetAZ1

  PrivateSubnetAZ2RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId: !Ref PrivateRouteTable
      SubnetId: !Ref PrivateSubnetAZ2

  PrivateSubnetAZ3RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Condition: HasThreeOrMoreAZs
    Properties:
      RouteTableId: !Ref PrivateRouteTable
      SubnetId: !Ref PrivateSubnetAZ3

  PrivateSubnetAZ4RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Condition: HasFourOrMoreAZs
    Properties:
      RouteTableId: !Ref PrivateRouteTable
      SubnetId: !Ref PrivateSubnetAZ4

  PrivateSubnetAZ5RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Condition: HasFiveOrMoreAZs
    Properties:
      RouteTableId: !Ref PrivateRouteTable
      SubnetId: !Ref PrivateSubnetAZ5

  PrivateSubnetAZ6RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Condition: HasSixOrMoreAZs
    Properties:
      RouteTableId: !Ref PrivateRouteTable
      SubnetId: !Ref PrivateSubnetAZ6

  # Security Groups
  SageMakerInstanceSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      Tags:
        - Key: "for-use-with-amazon-emr-managed-policies"
          Value: "true"
        - Key: Name
          Value: !Sub "${AWS::StackName}-sm-instance-sg"
      GroupName: SMSG
      GroupDescription: Security group for SageMaker instances
      SecurityGroupEgress:
        - IpProtocol: -1
          FromPort: -1
          ToPort: -1
          CidrIp: 0.0.0.0/0
      VpcId: !Ref VPC

  SageMakerInstanceSecurityGroupIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      IpProtocol: "-1"
      GroupId: !Ref SageMakerInstanceSecurityGroup
      SourceSecurityGroupId: !Ref SageMakerInstanceSecurityGroup

  VPCEndpointSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allow TLS for VPC Endpoint
      SecurityGroupEgress:
        - IpProtocol: -1
          FromPort: -1
          ToPort: -1
          CidrIp: 0.0.0.0/0
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-vpce-sg"

  EndpointSecurityGroupIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      IpProtocol: "-1"
      GroupId: !Ref VPCEndpointSecurityGroup
      SourceSecurityGroupId: !Ref SageMakerInstanceSecurityGroup

  # VPC Endpoints
  S3Endpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      ServiceName: !Sub "com.amazonaws.${AWS::Region}.s3"
      VpcEndpointType: Gateway
      PolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal: "*"
            Action: "*"
            Resource: "*"
      VpcId: !Ref VPC
      RouteTableIds:
        - !Ref PrivateRouteTable

  VPCEndpointSagemakerAPI:
    Type: AWS::EC2::VPCEndpoint
    DependsOn: S3Endpoint
    Properties:
      PolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal: "*"
            Action: "*"
            Resource: "*"
      VpcEndpointType: Interface
      PrivateDnsEnabled: true
      SubnetIds:
        - !Ref PrivateSubnetAZ1
        - !Ref PrivateSubnetAZ2
        - !If [HasThreeOrMoreAZs, !Ref PrivateSubnetAZ3, !Ref AWS::NoValue]
        - !If [HasFourOrMoreAZs, !Ref PrivateSubnetAZ4, !Ref AWS::NoValue]
        - !If [HasFiveOrMoreAZs, !Ref PrivateSubnetAZ5, !Ref AWS::NoValue]
        - !If [HasSixOrMoreAZs, !Ref PrivateSubnetAZ6, !Ref AWS::NoValue]
      SecurityGroupIds:
        - !Ref VPCEndpointSecurityGroup
      ServiceName: !Sub "com.amazonaws.${AWS::Region}.sagemaker.api"
      VpcId: !Ref VPC

  VPCEndpointSageMakerRuntime:
    Type: AWS::EC2::VPCEndpoint
    DependsOn: VPCEndpointSagemakerAPI
    Properties:
      PolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal: "*"
            Action: "*"
            Resource: "*"
      VpcEndpointType: Interface
      PrivateDnsEnabled: true
      SubnetIds:
        - !Ref PrivateSubnetAZ1
        - !Ref PrivateSubnetAZ2
        - !If [HasThreeOrMoreAZs, !Ref PrivateSubnetAZ3, !Ref AWS::NoValue]
        - !If [HasFourOrMoreAZs, !Ref PrivateSubnetAZ4, !Ref AWS::NoValue]
        - !If [HasFiveOrMoreAZs, !Ref PrivateSubnetAZ5, !Ref AWS::NoValue]
        - !If [HasSixOrMoreAZs, !Ref PrivateSubnetAZ6, !Ref AWS::NoValue]
      SecurityGroupIds:
        - !Ref VPCEndpointSecurityGroup
      ServiceName: !Sub "com.amazonaws.${AWS::Region}.sagemaker.runtime"
      VpcId: !Ref VPC

  VPCEndpointSTS:
    Type: AWS::EC2::VPCEndpoint
    DependsOn: VPCEndpointSageMakerRuntime
    Properties:
      PolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal: "*"
            Action: "*"
            Resource: "*"
      VpcEndpointType: Interface
      PrivateDnsEnabled: true
      SubnetIds:
        - !Ref PrivateSubnetAZ1
        - !Ref PrivateSubnetAZ2
        - !If [HasThreeOrMoreAZs, !Ref PrivateSubnetAZ3, !Ref AWS::NoValue]
        - !If [HasFourOrMoreAZs, !Ref PrivateSubnetAZ4, !Ref AWS::NoValue]
        - !If [HasFiveOrMoreAZs, !Ref PrivateSubnetAZ5, !Ref AWS::NoValue]
        - !If [HasSixOrMoreAZs, !Ref PrivateSubnetAZ6, !Ref AWS::NoValue]
      SecurityGroupIds:
        - !Ref VPCEndpointSecurityGroup
      ServiceName: !Sub "com.amazonaws.${AWS::Region}.sts"
      VpcId: !Ref VPC

  VPCEndpointCW:
    Type: AWS::EC2::VPCEndpoint
    DependsOn: VPCEndpointSTS
    Properties:
      PolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal: "*"
            Action: "*"
            Resource: "*"
      VpcEndpointType: Interface
      PrivateDnsEnabled: true
      SubnetIds:
        - !Ref PrivateSubnetAZ1
        - !Ref PrivateSubnetAZ2
        - !If [HasThreeOrMoreAZs, !Ref PrivateSubnetAZ3, !Ref AWS::NoValue]
        - !If [HasFourOrMoreAZs, !Ref PrivateSubnetAZ4, !Ref AWS::NoValue]
        - !If [HasFiveOrMoreAZs, !Ref PrivateSubnetAZ5, !Ref AWS::NoValue]
        - !If [HasSixOrMoreAZs, !Ref PrivateSubnetAZ6, !Ref AWS::NoValue]
      SecurityGroupIds:
        - !Ref VPCEndpointSecurityGroup
      ServiceName: !Sub "com.amazonaws.${AWS::Region}.monitoring"
      VpcId: !Ref VPC

  VPCEndpointCWL:
    Type: AWS::EC2::VPCEndpoint
    DependsOn: VPCEndpointCW
    Properties:
      PolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal: "*"
            Action: "*"
            Resource: "*"
      VpcEndpointType: Interface
      PrivateDnsEnabled: true
      SubnetIds:
        - !Ref PrivateSubnetAZ1
        - !Ref PrivateSubnetAZ2
        - !If [HasThreeOrMoreAZs, !Ref PrivateSubnetAZ3, !Ref AWS::NoValue]
        - !If [HasFourOrMoreAZs, !Ref PrivateSubnetAZ4, !Ref AWS::NoValue]
        - !If [HasFiveOrMoreAZs, !Ref PrivateSubnetAZ5, !Ref AWS::NoValue]
        - !If [HasSixOrMoreAZs, !Ref PrivateSubnetAZ6, !Ref AWS::NoValue]
      SecurityGroupIds:
        - !Ref VPCEndpointSecurityGroup
      ServiceName: !Sub "com.amazonaws.${AWS::Region}.logs"
      VpcId: !Ref VPC

  VPCEndpointECR:
    Type: AWS::EC2::VPCEndpoint
    DependsOn: VPCEndpointCWL
    Properties:
      PolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal: "*"
            Action: "*"
            Resource: "*"
      VpcEndpointType: Interface
      PrivateDnsEnabled: true
      SubnetIds:
        - !Ref PrivateSubnetAZ1
        - !Ref PrivateSubnetAZ2
        - !If [HasThreeOrMoreAZs, !Ref PrivateSubnetAZ3, !Ref AWS::NoValue]
        - !If [HasFourOrMoreAZs, !Ref PrivateSubnetAZ4, !Ref AWS::NoValue]
        - !If [HasFiveOrMoreAZs, !Ref PrivateSubnetAZ5, !Ref AWS::NoValue]
        - !If [HasSixOrMoreAZs, !Ref PrivateSubnetAZ6, !Ref AWS::NoValue]
      SecurityGroupIds:
        - !Ref VPCEndpointSecurityGroup
      ServiceName: !Sub "com.amazonaws.${AWS::Region}.ecr.dkr"
      VpcId: !Ref VPC

  VPCEndpointECRAPI:
    Type: AWS::EC2::VPCEndpoint
    DependsOn: VPCEndpointECR
    Properties:
      PolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal: "*"
            Action: "*"
            Resource: "*"
      VpcEndpointType: Interface
      PrivateDnsEnabled: true
      SubnetIds:
        - !Ref PrivateSubnetAZ1
        - !Ref PrivateSubnetAZ2
        - !If [HasThreeOrMoreAZs, !Ref PrivateSubnetAZ3, !Ref AWS::NoValue]
        - !If [HasFourOrMoreAZs, !Ref PrivateSubnetAZ4, !Ref AWS::NoValue]
        - !If [HasFiveOrMoreAZs, !Ref PrivateSubnetAZ5, !Ref AWS::NoValue]
        - !If [HasSixOrMoreAZs, !Ref PrivateSubnetAZ6, !Ref AWS::NoValue]
      SecurityGroupIds:
        - !Ref VPCEndpointSecurityGroup
      ServiceName: !Sub "com.amazonaws.${AWS::Region}.ecr.api"
      VpcId: !Ref VPC

  VPCEndpointKMS:
    Type: AWS::EC2::VPCEndpoint
    DependsOn: VPCEndpointECRAPI
    Properties:
      PolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal: "*"
            Action: "*"
            Resource: "*"
      VpcEndpointType: Interface
      PrivateDnsEnabled: true
      SubnetIds:
        - !Ref PrivateSubnetAZ1
        - !Ref PrivateSubnetAZ2
        - !If [HasThreeOrMoreAZs, !Ref PrivateSubnetAZ3, !Ref AWS::NoValue]
        - !If [HasFourOrMoreAZs, !Ref PrivateSubnetAZ4, !Ref AWS::NoValue]
        - !If [HasFiveOrMoreAZs, !Ref PrivateSubnetAZ5, !Ref AWS::NoValue]
        - !If [HasSixOrMoreAZs, !Ref PrivateSubnetAZ6, !Ref AWS::NoValue]
      SecurityGroupIds:
        - !Ref VPCEndpointSecurityGroup
      ServiceName: !Sub "com.amazonaws.${AWS::Region}.kms"
      VpcId: !Ref VPC

  # KMS Key for SageMaker Domain EFS encryption
  SageMakerKMSKey:
    Type: AWS::KMS::Key
    Properties:
      Description: KMS key for SageMaker Domain EFS encryption
      KeyPolicy:
        Version: "2012-10-17"
        Statement:
          - Sid: Enable IAM User Permissions
            Effect: Allow
            Principal:
              AWS: !Sub "arn:aws:iam::${AWS::AccountId}:root"
            Action: "kms:*"
            Resource: "*"
          - Sid: Allow SageMaker to use the key
            Effect: Allow
            Principal:
              Service: sagemaker.amazonaws.com
            Action:
              - "kms:Decrypt"
              - "kms:DescribeKey"
              - "kms:CreateGrant"
            Resource: "*"

  SageMakerKMSKeyAlias:
    Type: AWS::KMS::Alias
    Properties:
      AliasName: !Sub "alias/${AWS::StackName}-sagemaker"
      TargetKeyId: !Ref SageMakerKMSKey

  # IAM Role
  SageMakerExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${AWS::StackName}-executionrole"
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - bedrock.amazonaws.com
                - sagemaker.amazonaws.com
                - lambda.amazonaws.com
                - s3.amazonaws.com
            Action:
              - "sts:AssumeRole"
      Path: /
      Policies:
        - PolicyName: !Sub "${AWS::StackName}-sageemr"
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Sid: ReadSecretFromSecretsManager
                Effect: Allow
                Action:
                  - "secretsmanager:GetSecretValue"
                Resource: !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:*"
              - Effect: Allow
                Action:
                  - elasticmapreduce:ListInstances
                  - elasticmapreduce:DescribeCluster
                  - elasticmapreduce:DescribeSecurityConfiguration
                  - elasticmapreduce:CreatePersistentAppUI
                  - elasticmapreduce:DescribePersistentAppUI
                  - elasticmapreduce:GetPersistentAppUIPresignedURL
                  - elasticmapreduce:GetOnClusterAppUIPresignedURL
                  - elasticmapreduce:ListClusters
                  - iam:GetRole
                  - iam:PassRole
                  - logs:*
                  - kms:*
                Resource: "*"
              - Effect: Allow
                Action:
                  - elasticmapreduce:DescribeCluster
                  - elasticmapreduce:ListInstanceGroups
                Resource: !Sub "arn:${AWS::Partition}:elasticmapreduce:*:*:cluster/*"
              - Effect: Allow
                Action:
                  - elasticmapreduce:ListClusters
                Resource: "*"
        - PolicyName: !Sub "${AWS::StackName}-SMStar"
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Effect: "Allow"
                Action: "sagemaker:*"
                Resource: "*"
        - PolicyName: !Sub "${AWS::StackName}-BedrockStar"
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Effect: "Allow"
                Action: "bedrock:*"
                Resource: "*"
        # The first invocation of a third-party Bedrock model (for example Anthropic
        # Claude, used as the frontier baseline in lab 1) makes Bedrock open an AWS
        # Marketplace subscription on the caller's behalf. Without these actions that
        # subscription fails and the InvokeModel/Converse call returns AccessDenied.
        # The SDK pre-flights the execution role before submitting a job, using the
        # read-only iam:SimulatePrincipalPolicy API. Without it every job logs
        # "Could not verify permissions for role ... Proceeding with it."
        # sagemaker-mlflow is required for training runs to log to MLflow and is not
        # covered by AmazonSageMakerFullAccess.
        - PolicyName: !Sub "${AWS::StackName}-RoleSelfCheckAndMlflow"
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Effect: "Allow"
                Action:
                  - "iam:SimulatePrincipalPolicy"
                  - "sagemaker-mlflow:*"
                Resource: "*"
        - PolicyName: !Sub "${AWS::StackName}-MarketplaceSubscribe"
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Effect: "Allow"
                Action:
                  - "aws-marketplace:Subscribe"
                  - "aws-marketplace:Unsubscribe"
                  - "aws-marketplace:ViewSubscriptions"
                Resource: "*"
      ManagedPolicyArns:
        - !Sub "arn:${AWS::Partition}:iam::aws:policy/AmazonSageMakerFullAccess"
        - !Sub "arn:${AWS::Partition}:iam::aws:policy/AmazonS3FullAccess"
        - !Sub "arn:${AWS::Partition}:iam::aws:policy/AWSLambda_FullAccess"
        - !Sub "arn:${AWS::Partition}:iam::aws:policy/SecretsManagerReadWrite"
        - !Sub "arn:${AWS::Partition}:iam::aws:policy/AWSCloudTrail_FullAccess"
        - !Sub "arn:${AWS::Partition}:iam::aws:policy/CloudWatchFullAccessV2"

  # SageMaker Studio Domain
  StudioDomain:
    Type: AWS::SageMaker::Domain
    DependsOn:
      - SageMakerKMSKey
      - VPCEndpointKMS
      - VPCEndpointSagemakerAPI
      - VPCEndpointSageMakerRuntime
      - VPCEndpointSTS
      - S3Endpoint
    Properties:
      DomainName: !Ref SageMakerStudioDomainName
      AppNetworkAccessType: VpcOnly
      AuthMode: IAM
      KmsKeyId: !GetAtt SageMakerKMSKey.Arn
      VpcId: !Ref VPC
      SubnetIds:
        - !Ref PrivateSubnetAZ1
        - !Ref PrivateSubnetAZ2
        - !If [HasThreeOrMoreAZs, !Ref PrivateSubnetAZ3, !Ref AWS::NoValue]
        - !If [HasFourOrMoreAZs, !Ref PrivateSubnetAZ4, !Ref AWS::NoValue]
        - !If [HasFiveOrMoreAZs, !Ref PrivateSubnetAZ5, !Ref AWS::NoValue]
        - !If [HasSixOrMoreAZs, !Ref PrivateSubnetAZ6, !Ref AWS::NoValue]
      DefaultUserSettings:
        ExecutionRole: !GetAtt SageMakerExecutionRole.Arn
        SecurityGroups:
          - !Ref SageMakerInstanceSecurityGroup
      DefaultSpaceSettings:
        ExecutionRole: !GetAtt SageMakerExecutionRole.Arn

  StudioUserProfile:
    Type: AWS::SageMaker::UserProfile
    Properties:
      DomainId: !Ref StudioDomain
      UserProfileName: !Ref SageMakerStudioDefaultUserName
      UserSettings:
        ExecutionRole: !GetAtt SageMakerExecutionRole.Arn
        SpaceStorageSettings:
          DefaultEbsStorageSettings:
            DefaultEbsVolumeSizeInGb: 5
            MaximumEbsVolumeSizeInGb: 100

  JupyterLabSpace:
    Type: AWS::SageMaker::Space
    DependsOn: StudioUserProfile
    Properties:
      DomainId: !Ref StudioDomain
      SpaceName: !Sub "${SageMakerStudioDefaultUserName}-jupyterlab-space"
      OwnershipSettings:
        OwnerUserProfileName: !Ref SageMakerStudioDefaultUserName
      SpaceSharingSettings:
        SharingType: Private
      SpaceSettings:
        AppType: JupyterLab
        JupyterLabAppSettings:
          DefaultResourceSpec:
            InstanceType: !Ref JupyterLabInstanceType
            # redundant since default provided in domain
        SpaceStorageSettings:
          EbsStorageSettings:
            EbsVolumeSizeInGb: !Ref JupyterLabStorageSize

  # Lambda execution role for starting the JupyterLab space
  StartSpaceLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${AWS::StackName}-start-space-lambda-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: "sts:AssumeRole"
      ManagedPolicyArns:
        - !Sub "arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole"
      Policies:
        - PolicyName: SageMakerSpaceStartPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - "sagemaker:CreateApp"
                Resource: "*"

  # Lambda function to start the JupyterLab space
  StartSpaceLambdaFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "${AWS::StackName}-start-jupyterlab-space"
      Runtime: python3.12
      Handler: index.handler
      Role: !GetAtt StartSpaceLambdaRole.Arn
      Timeout: 60
      Code:
        ZipFile: |
          import boto3
          import cfnresponse

          def handler(event, context):
              try:
                  if event['RequestType'] != 'Create':
                      cfnresponse.send(event, context, cfnresponse.SUCCESS, {})
                      return

                  boto3.client('sagemaker').create_app(
                      DomainId=event['ResourceProperties']['DomainId'],
                      SpaceName=event['ResourceProperties']['SpaceName'],
                      AppType='JupyterLab',
                      AppName='default',
                      ResourceSpec={
                          'InstanceType': event['ResourceProperties']['InstanceType'],
                          'SageMakerImageArn': 'arn:aws:sagemaker:us-east-1:885854791233:image/sagemaker-distribution-cpu',
                          'SageMakerImageVersionAlias': '3.6.1'
                      }
                  )
                  cfnresponse.send(event, context, cfnresponse.SUCCESS, {})
              except Exception as e:
                  print(e)
                  cfnresponse.send(event, context, cfnresponse.FAILED, {"Error": str(e)})

  # Custom resource to trigger the Lambda function
  StartJupyterLabSpace:
    Type: Custom::StartSpace
    DependsOn: JupyterLabSpace
    Properties:
      ServiceToken: !GetAtt StartSpaceLambdaFunction.Arn
      DomainId: !Ref StudioDomain
      SpaceName: !Sub "${SageMakerStudioDefaultUserName}-jupyterlab-space"
      InstanceType: !Ref JupyterLabInstanceType

Outputs:
  VpcId:
    Description: VPC ID
    Value: !Ref VPC
    Export:
      Name: !Sub "${AWS::StackName}-vpc-id"

  PrivateSubnets:
    Description: List of private subnet IDs
    Value: !Join
      - ","
      - - !Ref PrivateSubnetAZ1
        - !Ref PrivateSubnetAZ2
        - !If [HasThreeOrMoreAZs, !Ref PrivateSubnetAZ3, !Ref AWS::NoValue]
        - !If [HasFourOrMoreAZs, !Ref PrivateSubnetAZ4, !Ref AWS::NoValue]
        - !If [HasFiveOrMoreAZs, !Ref PrivateSubnetAZ5, !Ref AWS::NoValue]
        - !If [HasSixOrMoreAZs, !Ref PrivateSubnetAZ6, !Ref AWS::NoValue]
    Export:
      Name: !Sub "${AWS::StackName}-private-subnets"

  SageMakerCloudformationVPCId:
    Description: The ID of the Sagemaker Studio VPC
    Value: !Ref VPC
    Export:
      Name: "SageMakerCloudformationVPCId"

  SageMakerDomain:
    Description: "SageMaker Domain Id"
    Value: !Ref StudioDomain
    Export:
      Name: SageMakerDomainId

  SageMakerDomainUrl:
    Value: !Join
      - ""
      - - "https://console.aws.amazon.com/sagemaker/home?region="
        - !Ref "AWS::Region"
        - "#/studio/"
        - !Ref StudioDomain
    Description: URL to access the SageMaker Domain
